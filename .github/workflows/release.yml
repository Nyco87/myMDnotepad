name: Release exe

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build portable exe
        run: npx tauri build --no-bundle

      - name: Attach exe to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" src-tauri/target/release/mymdnotepad.exe --clobber

      - name: Keep exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mymdnotepad
          path: src-tauri/target/release/mymdnotepad.exe
