name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend · tests & coverage
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest with coverage
        run: npx vitest run --coverage
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (n, k) => `| ${n} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
              console.log("### Frontend coverage\n\n| Metric | Coverage | Covered |\n|---|---|---|");
              console.log([row("Lines","lines"), row("Branches","branches"), row("Functions","functions"), row("Statements","statements")].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  frontend-lint:
    name: Frontend · lint & types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript type check
        run: npm run typecheck

  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  rust-lint:
    name: Rust · format & clippy
    runs-on: windows-latest
    needs: frontend-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: lint
      - name: Check formatting (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  rust-tests:
    name: Rust · tests & coverage
    runs-on: windows-latest
    needs: frontend-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run tests with coverage
        working-directory: src-tauri
        run: cargo llvm-cov --locked --lcov --output-path lcov.info
      - name: Coverage summary
        if: always()
        working-directory: src-tauri
        shell: bash
        run: |
          cargo llvm-cov report --summary-only | tee cov-summary.txt
          {
            echo "### Rust coverage"
            echo
            echo '```'
            cat cov-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src-tauri/lcov.info
          flags: rust
          fail_ci_if_error: false

  audit:
    name: Security · dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
